# ============================================================
# KITTYLM // PYTHON PROJECT CONFIGURATION
# Independent Language Model Research & Engineering
# ============================================================

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


# ============================================================
# PROJECT METADATA
# ============================================================

[project]
name = "kittylm"
version = "0.1.0.dev0"

description = "KittyLM: an independent language-model research and engineering platform focused on reproducible experimentation."

readme = "README.md"
requires-python = ">=3.12"

license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
]

authors = [
    { name = "KrazyKitty" },
]

keywords = [
    "artificial-intelligence",
    "machine-learning",
    "deep-learning",
    "language-model",
    "causal-language-model",
    "transformer",
    "neural-networks",
    "pytorch",
    "tokenization",
    "scientific-research",
    "reproducibility",
    "model-evaluation",
    "rocm",
]


# ============================================================
# PYPI CLASSIFIERS
# ============================================================

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


# ============================================================
# PROJECT LINKS
# ============================================================

[project.urls]
Homepage = "https://krazykitty.dev"
Repository = "https://github.com/krazykitty2503/kittylm"
Documentation = "https://github.com/krazykitty2503/kittylm/tree/main/docs"
Issues = "https://github.com/krazykitty2503/kittylm/issues"


# ============================================================
# RUNTIME DEPENDENCIES
# ============================================================

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "regex>=2024.0",
]


# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

[project.optional-dependencies]

dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "build==1.6.1",
]
